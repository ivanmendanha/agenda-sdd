# DevHub Generated - Docker Compose (Development)
name: agenda-sdd

services:
  agenda-sdd:
    container_name: agenda-sdd
    dns:
      - 8.8.8.8
      - 1.1.1.1
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/
    volumes:
      - ./:/var/www/
    restart: no
    extra_hosts:
      # How the app reaches a service running on the HOST rather than in a
      # container — a native MySQL, Redis, or anything outside Docker.
      # Docker Desktop (macOS/Windows) resolves host.docker.internal for free;
      # plain Docker Engine on LINUX DOES NOT. Without this line the container
      # dies with "php_network_getaddresses: could not resolve host" while the
      # .env looks perfectly correct — which is the worst kind of bug to debug.
      # `host-gateway` is a Docker-resolved alias for the host (20.10+), so the
      # same line is right on every platform.
      - "host.docker.internal:host-gateway"
    networks:
      - agenda-sdd
      - devhub
    ports:
      - "5174:5174"
    # Intentionally no `env_file: .env` here. Compose's env_file injects every
    # variable into the container's OS environment at create-time, and Laravel's
    # phpdotenv runs in immutable mode — values already present in getenv() win
    # over the .env file. The result: edits to .env are silently ignored until
    # the container is recreated, which is exactly the "I have to force-recreate
    # to see my .env change" complaint. Laravel reads /var/www/.env directly via
    # the bind mount below, and the env-watcher in supervisord runs
    # `artisan config:clear` on every edit, so changes go live on the next
    # request without any container churn. (The `${VAR}` interpolation in this
    # YAML still works — Compose loads ./.env for its own substitution
    # independently of env_file.)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: nginx_agenda-sdd
    restart: no
    ports:
      - "127.0.0.1:8097:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - agenda-sdd
    networks:
      - agenda-sdd
      - devhub

networks:
  agenda-sdd:
    driver: bridge
  devhub:
    driver: bridge
    name: devhub
    external: true
